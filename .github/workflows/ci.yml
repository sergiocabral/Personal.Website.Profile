name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm audit --audit-level=high

      - run: npm run verify:content

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check

      - run: npm run build

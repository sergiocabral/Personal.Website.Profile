# Configuração de publicação no Netlify.
#
# Este arquivo existe porque o painel do Netlify guardava a configuração do
# projeto anterior, em Gatsby: `gatsby build` publicando `public/`. No projeto
# atual, `public/` é a pasta de assets de *entrada* do Vite — publicá-la
# entregaria o favicon e o robots.txt, e nenhum HTML.
#
# Um netlify.toml versionado tem precedência sobre o painel, então a
# configuração de publicação passa a viver junto do código que ela publica.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Mesma versão do CI, para o build não divergir entre os dois ambientes.
  NODE_VERSION = "24"

# As rotas são pré-renderizadas como arquivos (`/index.html`, `/game/index.html`),
# então não há necessidade do redirecionamento para SPA. O que sobra cai no
# 404.html, que serve o conteúdo da raiz.

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Os arquivos em /assets carregam hash no nome: mudou o conteúdo, mudou a
    # URL. Podem ser guardados para sempre.
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    # O HTML aponta para os assets com hash, então precisa ser sempre revalidado.
    Cache-Control = "public, max-age=0, must-revalidate"
